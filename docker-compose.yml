# Volzo Mobility - Docker Compose Configuration
# Production-grade multi-container setup

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: volzo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: volzo
      POSTGRES_PASSWORD: volzo_password
      POSTGRES_DB: volzo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volzo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - volzo-network

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: volzo-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://volzo:volzo_password@postgres:5432/volzo_db?schema=public
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - volzo-network

  # Admin Dashboard
  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    container_name: volzo-admin
    restart: unless-stopped
    ports:
      - "3001:80"
    environment:
      REACT_APP_API_URL: http://localhost:3000/api/v1
      REACT_APP_SOCKET_URL: http://localhost:3000
    depends_on:
      - backend
    networks:
      - volzo-network

  # Redis (Optional - for caching and session management)
  redis:
    image: redis:7-alpine
    container_name: volzo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - volzo-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  volzo-network:
    driver: bridge
