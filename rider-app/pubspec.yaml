name: volzo_rider
description: Volzo Mobility - Rider Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.10
  riverpod_annotation: ^2.3.3

  # UI & Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.0.0

  # Maps & Location
  google_maps_flutter: ^2.5.3
  geolocator: ^11.0.0
  geocoding: ^2.1.1

  # Firebase
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.0
  firebase_messaging: ^15.2.0
  google_sign_in: ^6.2.2

  # Networking
  dio: ^5.4.0
  socket_io_client: ^2.0.3+1
  connectivity_plus: ^5.0.2

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Image Handling
  image_picker: ^1.0.7
  image_cropper: ^12.2.1

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.2.4
  permission_handler: ^11.2.0
  flutter_dotenv: ^5.1.0
  uuid: ^4.3.3

  # QR Code
  qr_flutter: ^4.1.0
  pin_code_fields: ^8.0.1

  # Payment Gateway
  razorpay_flutter: ^1.3.5

  # Map Route Drawing
  flutter_polyline_points: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.8
  riverpod_lint: ^2.3.7

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/

